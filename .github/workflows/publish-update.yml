# After every change to the app (www/), publish it as a zip on the "updates" branch.
# The installed iPhone app checks updates/version.json on launch and downloads the new zip in the background.
name: Publish app update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [www/**, .github/workflows/publish-update.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the date of the last app change
      - name: Zip app and push to the updates branch
        run: |
          set -e
          # version = hash of the www/ folder, so the .ipa build and this update agree on the version of identical files
          V=$(git rev-parse --short HEAD:www)
          D=$(git log -1 --format=%cI -- www)
          echo "{\"version\":\"$V\",\"date\":\"$D\"}" > www/build.json
          mkdir out
          (cd www && zip -qrX "../out/www-$V.zip" .)
          SUM=$(sha256sum "out/www-$V.zip" | cut -d' ' -f1)
          echo "{\"version\":\"$V\",\"date\":\"$D\",\"url\":\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/updates/www-$V.zip\",\"checksum\":\"$SUM\"}" > out/version.json
          cat out/version.json
          cd out
          git init -q -b updates
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "App update $V"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" updates
