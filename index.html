<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>myGym</title>
  <meta name="apple-mobile-web-app-title" content="myGym">
  <!-- apply saved theme before first paint so there's no flash -->
  <script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#/home" class="brand"><img src="icon.svg" alt=""> myGym</a>
    <button id="themeBtn" class="icon-btn" title="Theme" aria-label="Switch theme"></button>
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
  <div id="rest" hidden>
    <span>Rest</span><b></b>
    <button onclick="addRest(15)">+15s</button>
    <button onclick="stopRest()">Skip</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="nav" hidden></nav>
  <dialog id="dialog"></dialog>
  <script src="app.js"></script>
</body>
</html>
